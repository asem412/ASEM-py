{% extends "base.html" %}

{% block title %}
{% if employee %}従業員編集{% else %}従業員登録{% endif %} - 有給管理システム
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1>{% if employee %}従業員編集{% else %}従業員登録{% endif %}</h1>

        <form method="post" action="{% if employee %}/employees/{{ employee.id }}{% else %}/employees/{% endif %}">
            <div class="mb-3">
                <label for="employee_code" class="form-label">社員番号 *</label>
                <input type="text" class="form-control" id="employee_code" name="employee_code"
                       value="{% if employee %}{{ employee.employee_code }}{% endif %}" required>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label">氏名 *</label>
                <input type="text" class="form-control" id="name" name="name"
                       value="{% if employee %}{{ employee.name }}{% endif %}" required>
            </div>

            <div class="mb-3">
                <label for="hire_date" class="form-label">入社日 *</label>
                <input type="date" class="form-control" id="hire_date" name="hire_date"
                       value="{% if employee %}{{ employee.hire_date }}{% endif %}" required>
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="active" name="active" value="true"
                           {% if not employee or employee.active %}checked{% endif %}>
                    <label class="form-check-label" for="active">
                        在籍中
                    </label>
                </div>
            </div>

            <div class="mb-3">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="/employees/" class="btn btn-secondary">キャンセル</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
